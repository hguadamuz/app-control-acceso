 <style>
    /* ---------------------------------------------------- */
    /* ESTILOS Y FIX DE ESCALADO (OPTIMIZADO PARA iFRAME) */
    /* ---------------------------------------------------- */

    /* AJUSTE CRUCIAL: html, body juntos para control total del iFrame */
    html, body {
      width: 100% !important;
      /* min-height: 100vh se cambia a height: 100% para evitar scrollbars */
      height: 100% !important; 
      margin: 0 !important;
      padding: 0 !important;
      
      /* FIX: Eliminar barras de desplazamiento horizontales y verticales no deseadas */
      overflow-x: hidden !important; 
      overflow-y: auto; /* Permitir scroll vertical solo si es necesario */
      
      background-color: #f8f9fa; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* ELIMINACIÓN DEL CÓDIGO PROBLEMÁTICO:
       #app-wrapper es el causante del problema.
       Se elimina 'transform: scale(1.5);' y 'width: 66.66%'. */
    #app-wrapper {
        /* Se usa 100% de ancho y auto en alto para flujo normal */
        width: 100% !important; 
        height: auto;
        padding: 0;
        margin: 0;
        margin-bottom: 0px !important; 
        
        /* Asegura que el contenido respeta el padding/margen de los contenedores */
        box-sizing: border-box; 
    }

    /* CONTENEDORES DE FORMA */
    .form-container { 
      background-color: #ffffff; 
      /* Reducir padding horizontal para ganar espacio si es necesario */
      padding: 20px 15px !important; 
      width: 100%; 
      box-shadow: none !important; 
      border-radius: 0;
      margin-bottom: 0px !important; 
      box-sizing: border-box; 
    }

    /* ENCABEZADOS Y LOGO */
    .header-container {
        display: flex; 
        align-items: center; 
        margin-bottom: 1rem; /* Reducir margen */
        padding-left: 0px; /* Eliminar padding de 5px */
    }

    .app-logo {
        max-width: 65px; /* Reducir tamaño del logo */
        height: auto;
        margin-right: 10px; /* Reducir margen a la derecha */
        display: block;
    }
    
    h2 { 
      font-weight: 700; 
      font-size: 1.4rem; /* Ligeramente más pequeño */
      margin: 0; 
      color: #0d6efd; 
    }

    /* ELEMENTOS DE FORMULARIO */
    .form-label { 
        font-weight: 700; 
        font-size: 0.9rem; /* Ligeramente más pequeño */
        margin-bottom: 0.5rem; 
        padding-left: 0px; /* Eliminar padding de 5px */
    }

    .form-select, .form-control { 
      font-size: 0.95rem; /* Ligeramente más pequeño */
      padding: 0.7rem 0.8rem; /* Reducir padding interno */
      border-radius: 10px; /* Ligeramente más pequeño */
      margin-left: 0px; /* Eliminar margen */
      width: 100%; /* Usar 100% sin calc() */
      box-sizing: border-box;
    }
    
    .btn-primary { 
      font-size: 1rem; /* Ligeramente más pequeño */
      font-weight: bold; 
      padding: 0.9rem 1rem; /* Reducir padding */
      border-radius: 10px; /* Ligeramente más pequeño */
      margin-left: 0px; /* Eliminar margen */
      width: 100%; /* Usar 100% sin calc() */
      background-color: #0d6efd; 
      border-color: #0d6efd;
      box-sizing: border-box;
    }

    /* UTILIDADES */
    .mb-3 { margin-bottom: 1.2rem !important; } /* Reducir margen */
    .mb-4 { margin-bottom: 1.5rem !important; } /* Reducir margen */

    .d-grid {
        display: flex !important;
        justify-content: center;
        margin-top: 1rem; /* Reducir margen superior */
    }
    
    /* ESTILOS DEL SPINNER */
    .spinner-border {
        width: 1.25rem;
        height: 1.25rem;
        margin-right: 0.5rem;
    }
    .d-none { display: none !important; }
</style>

            <h2>Control Entrada|Salida📱</h2>
        </div>

        <form id="accessForm">
          
          <div class="mb-3">
            <label for="idInput" class="form-label">🔑 Ingresa tu Número Cedula (ID)</label>
            <input type="number" class="form-control" id="idInput" placeholder="Solo el número 123456789" required min="1">
            <label for="nameDisplay" class="form-label mt-3">👤 Nombre Completo</label>
            <input type="text" class="form-control" id="nameDisplay" placeholder="Busca por ID para ver el nombre..." readonly>
          </div>
          
          <div class="mb-3">
            <label for="typeSelect" class="form-label">➡️ Tipo de Registro</label>
            <select class="form-select" id="typeSelect" required>
              <option value="" disabled selected>Selecciona una opción</option>
              <option value="Entrada">Entrada 📥</option>
              <option value="Salida">Salida 📤</option>
            </select>
          </div>
          
          <div class="mb-3">
            <label for="oficinaSalidaSelect" class="form-label">🏢 Oficina Salida</label>
            <select class="form-select" id="oficinaSalidaSelect" required>
              <option value="" disabled selected>Cargando oficinas...</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="oficinaDestinoSelect" class="form-label">🎯 Oficina Destino</label>
            <select class="form-select" id="oficinaDestinoSelect" required>
              <option value="" disabled selected>Cargando oficinas...</option>
            </select>
          </div>
          
          <div class="mb-4">
            <label for="locationInput" class="form-label">📍 Ubicación GPS</label>
            <input type="text" class="form-control" id="locationInput" readonly placeholder="Esperando coordenadas...">
          </div>
          
          <div class="d-grid">
            <button type="submit" class="btn-primary" id="submitButton" disabled>
              <span id="submitSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
              <span id="submitText">❌ Ingresa ID Válida</span>
            </button>
          </div>
        </form>
        
        <div id="alertMessage" class="mt-3" style="display:none;"></div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ... (El JavaScript sigue siendo el mismo) ...
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('accessForm');
      const idInput = document.getElementById('idInput');
      const nameDisplay = document.getElementById('nameDisplay');
      const submitButton = document.getElementById('submitButton');
      const submitSpinner = document.getElementById('submitSpinner');
      const submitText = document.getElementById('submitText');
      
      const typeSelect = document.getElementById('typeSelect');
      const oficinaSalidaSelect = document.getElementById('oficinaSalidaSelect');
      const oficinaDestinoSelect = document.getElementById('oficinaDestinoSelect');
      
      const locationInput = document.getElementById('locationInput');
      const alertMessage = document.getElementById('alertMessage');
      
      let currentEmployeeName = ''; 

      function resetSubmitButton() {
          submitButton.disabled = true;
          submitSpinner.classList.add('d-none');
          submitText.textContent = '❌ Ingresa ID Válida';
      }
      
      function setSubmitLoading(isLoading) {
          submitButton.disabled = isLoading;
          if (isLoading) {
              submitSpinner.classList.remove('d-none');
              submitText.textContent = 'Registrando...';
          } else {
              submitSpinner.classList.add('d-none');
          }
      }

      function searchEmployeeID(employeeID) {
        if (!employeeID) return;
        
        nameDisplay.value = 'Buscando...';
        submitButton.disabled = true;
        submitText.textContent = 'Buscando...';

        google.script.run.withSuccessHandler(name => {
          if (name) {
            currentEmployeeName = name;
            nameDisplay.value = name;
            submitButton.disabled = false;
            submitText.textContent = '✅ Registrar Entrada/Salida';
            showAlert(`Bienvenido(a), ${name}`, 'alert-success');
          } else {
            currentEmployeeName = '';
            nameDisplay.value = 'ID no encontrada.';
            resetSubmitButton();
            showAlert('Código de Empleado (ID) no encontrado.', 'alert-danger');
          }
        }).withFailureHandler(error => {
            currentEmployeeName = '';
            nameDisplay.value = 'Error de conexión.';
            resetSubmitButton();
            showAlert('Error al buscar el ID. Intente nuevamente.', 'alert-danger');
        }).getEmployeeNameByID(employeeID); 
      }
      
      idInput.addEventListener('input', () => {
          if (idInput.value.trim() === '') {
             nameDisplay.value = 'Busca por ID para ver el nombre...';
             resetSubmitButton();
             return;
          }
          if (idInput.value.length >= 4) { 
              searchEmployeeID(idInput.value.trim());
          } else {
             nameDisplay.value = 'Ingresa la ID completa...';
             resetSubmitButton();
          }
      });
      
      function getLocation() {
        if (navigator.geolocation) {
          locationInput.value = 'Obteniendo ubicación...';
          navigator.geolocation.getCurrentPosition(position => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            locationInput.value = `Latitud: ${lat}, Longitud: ${lon}`;
          }, error => {
            locationInput.value = 'Ubicación no disponible (Activar GPS)';
            console.error('Error al obtener la ubicación:', error);
          });
        } else {
          locationInput.value = 'Geolocalización no soportada';
        }
      }

      function loadOfficeNames() {
        google.script.run.withSuccessHandler(names => {
          if (oficinaSalidaSelect.options.length <= 1) { 
              oficinaSalidaSelect.innerHTML = '<option value="" disabled selected>Selecciona oficina</option>';
              oficinaDestinoSelect.innerHTML = '<option value="" disabled selected>Selecciona oficina</option>';
          }
          names.forEach(name => {
            const option1 = document.createElement('option');
            option1.value = name;
            option1.textContent = name;
            oficinaSalidaSelect.appendChild(option1);

            const option2 = document.createElement('option');
            option2.value = name;
            option2.textContent = name;
            oficinaDestinoSelect.appendChild(option2);
          });
        }).withFailureHandler(error => {
          oficinaSalidaSelect.innerHTML = '<option value="" disabled selected>Error al cargar oficinas</option>';
          oficinaDestinoSelect.innerHTML = '<option value="" disabled selected>Error al cargar oficinas</option>';
        }).getOfficeNames();
      }

      function showAlert(message, type) {
        alertMessage.textContent = message;
        alertMessage.className = `alert ${type} mt-3`;
        alertMessage.style.display = 'block';
        setTimeout(() => { alertMessage.style.display = 'none'; }, 5000);
      }
      
      // Inicialización
      loadOfficeNames();
      getLocation(); 

      // Manejo del Formulario
      form.addEventListener('submit', event => {
        event.preventDefault();
        
        if (!currentEmployeeName) {
            showAlert('Por favor, ingresa una ID válida antes de registrar.', 'alert-danger');
            return;
        }
        
        if (typeSelect.value === "" || 
            oficinaSalidaSelect.value === "" ||
            oficinaDestinoSelect.value === "") {
            showAlert('Por favor, selecciona opciones válidas en todos los campos de Registro y Oficina.', 'alert-warning');
            return;
        }

        setSubmitLoading(true);

        const data = {
          name: currentEmployeeName, 
          employeeId: idInput.value,
          type: typeSelect.value,
          location: locationInput.value,
          oficinaSalida: oficinaSalidaSelect.value,
          oficinaDestino: oficinaDestinoSelect.value
        };

        const successHandler = response => {
            setSubmitLoading(false);
            
            if (response.success) {
                showAlert('Registro guardado con éxito. 🎉', 'alert-success');
                form.reset();
                getLocation(); 
                currentEmployeeName = '';
                nameDisplay.value = 'Busca por ID para ver el nombre...';
                resetSubmitButton(); 
            } else {
                showAlert('Error al registrar: ' + response.message, 'alert-danger');
                submitText.textContent = '❌ Error de Registro'; 
            }
        };

        const failureHandler = error => {
            setSubmitLoading(false);
            
            showAlert('Ocurrió un error. Inténtalo de nuevo. ' + error.message, 'alert-danger');
            submitText.textContent = '❌ Error de Conexión'; 
        };
        
        google.script.run
            .withSuccessHandler(successHandler)
            .withFailureHandler(failureHandler)
            .registerEntry(data);
      });
    });
  </script>
